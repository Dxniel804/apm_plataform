name: apm-digital

# Three database identities (see docs/tenancy.md):
#   POSTGRES_USER  admin: creates roles and runs migrations/seed/tests. Never inside the API process.
#   apm_owner      NOLOGIN role that owns the tables (migrations run DDL as it).
#   apm_app        what the API connects as: no superuser, no BYPASSRLS, not the owner.
x-api-build: &api-build
  context: ./apps/api
  target: dev

# Only the one-shot and tool services get the admin URL.
x-tool-env: &tool-env
  ENV: ${ENV:-development}
  AUTH_SECRET: ${AUTH_SECRET:?copy .env.example to .env}
  DATABASE_URL: postgresql+psycopg://apm_app:${APP_DB_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
  DATABASE_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:?copy .env.example to .env}:${POSTGRES_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5435}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # One-shot: applies migrations (creates the roles, tables, policies and grants), then exits.
  migrate:
    build: *api-build
    environment: *tool-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: *api-build
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://apm_app:${APP_DB_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
      AUTH_SECRET: ${AUTH_SECRET:?copy .env.example to .env}
      # Development only: WebKit (Safari, the Maestri portal) does not accept a Secure cookie over
      # plain http. The API refuses to start with ENV=production unless this is true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGINS: ${PUBLIC_ORIGINS:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      OUTBOX_DIR: /outbox
      # Expense attachments (TASK-007): files on a volume, never in the database or the repository.
      ATTACHMENTS_DIR: /attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      # Reading a receipt photo (docs/ocr.md): off unless OCR_ENABLED=true; then the `ocr` service
      # (profile `ocr`) answers on the private network `ocr_net`, with the secret both sides share.
      OCR_ENABLED: ${OCR_ENABLED:-false}
      OCR_URL: ${OCR_URL:-http://ocr:8080}
      OCR_TOKEN: ${OCR_TOKEN:-}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-30}
      # Which peers uvicorn believes about X-Forwarded-For: only the reverse proxy's address. With
      # no proxy in front keep the default (nothing forwarded is trusted).
      FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1}
    volumes:
      - outbox:/outbox
      - attachments:/attachments
    networks:
      - default
      - ocr_net
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The expiry job (TASK-008, ADR-019): every minute it expires the Pix charges and the contributions
  # nobody paid. Same image and same database identity as the API (apm_app); no credential of its
  # own, no published port. Logs one line only when it did something or something failed.
  jobs:
    build: *api-build
    environment:
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+psycopg://apm_app:${APP_DB_PASSWORD:?copy .env.example to .env}@db:5432/${POSTGRES_DB:?copy .env.example to .env}
    command: ["python", "-m", "app.jobs.expire", "--loop", "--interval", "60"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # A second, throwaway Postgres cluster: no published port, data in memory, not started by `up`.
  # Only the tests use it, for what cannot be checked in the main cluster: running the migrations
  # as a CREATEROLE admin that is NOT a superuser (the managed-service case) in a cluster where the
  # roles do not exist yet (review H1).
  db-clean:
    image: postgres:16
    profiles: ["tools"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  # Not started by `up`. Usage: docker compose run --rm tools <command>
  # (pytest, alembic, python -m app.seed, python -m app.posture).
  tools:
    build: *api-build
    profiles: ["tools"]
    environment:
      <<: *tool-env
      CLEAN_CLUSTER_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?copy .env.example to .env}@db-clean:5432/postgres
    command: ["python", "-c", "print('usage: docker compose run --rm tools <command>')"]
    depends_on:
      db:
        condition: service_healthy
      db-clean:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The service that reads a receipt photo with a LOCAL model (docs/ocr.md). Not started by `up`
  # (heavy): `docker compose --profile ocr up -d ocr`. It is on a private network with no way out,
  # publishes no port, runs as a user with no privileges on a read-only filesystem, and loads its
  # model only from the read-only volume `ocr_models` (download it beforehand, pinned by revision).
  ocr:
    profiles: ["ocr"]
    build:
      context: ./apps/ocr
      target: run
      args:
        INSTALL_HF: ${OCR_INSTALL_HF:-0}
    environment:
      # The service refuses to start without a secret of 24+ characters (openssl rand -hex 32).
      OCR_TOKEN: ${OCR_TOKEN:-}
      ENV: ${ENV:-development}
      OCR_ENGINE: ${OCR_ENGINE:-stub}
      OCR_MODEL_ID: ${OCR_MODEL_ID:-}
      OCR_MODEL_REVISION: ${OCR_MODEL_REVISION:-}
    volumes:
      - ocr_models:/models:ro
    networks:
      - ocr_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${OCR_MEMORY_LIMIT:-4g}
    cpus: ${OCR_CPUS:-2}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

networks:
  default: {}
  # internal: containers on it reach each other and nothing else (no internet, no host).
  ocr_net:
    internal: true

volumes:
  db_data:
  # Development e-mail outbox (invitation links, password notices), files with mode 0600.
  outbox:
  # The files attached to expenses (receipts), mode 0700, owned by the API user.
  attachments:
  # The weights of the OCR model, downloaded beforehand and mounted read-only (docs/ocr.md).
  ocr_models:
